workflows:
  kantorfit-ios:
    name: KantorFit iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Prepare Firebase iOS config
        script: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "ERROR: GOOGLE_SERVICE_INFO_PLIST is empty or unavailable"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist || exit 1
          if [ ! -s ios/Runner/GoogleService-Info.plist ]; then
            echo "ERROR: Firebase plist file is empty"
            exit 1
          fi
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Build iOS app
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/iphoneos/*.ipa
      - /tmp/xcodebuild_logs/*.log